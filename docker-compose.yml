version: '3.8'

services:
  frontend:
    build: ./apps/frontend
    container_name: dev_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    restart: unless-stopped

  backend:
    build: ./apps/backend
    container_name: dev_backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    environment:
      DATABASE_URL: mongodb://dev_user:dev_password@mongo:27017/dev_event_db?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_key_123
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: dev_mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=dev_user
      - MONGO_INITDB_ROOT_PASSWORD=dev_password
      - MONGO_INITDB_DATABASE=dev_event_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dev_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
